<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로컬 RAG 챗봇</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --text:#1d2330; --muted:#6b7280; --line:#e5e7eb; --accent:#2f6fed; --soft:#e8f0fe; --danger:#d93025; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif; background:var(--bg); color:var(--text); }
  header { padding:12px 20px; background:var(--panel); border-bottom:1px solid var(--line); font-weight:700; }
  header span { font-weight:400; color:var(--muted); font-size:13px; margin-left:8px; }
  .wrap { display:grid; grid-template-columns:300px 1fr; gap:16px; max-width:1100px; margin:16px auto; padding:0 16px; height:calc(100vh - 90px); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; overflow:auto; }
  h3 { margin:0 0 10px; font-size:15px; }
  button { font:inherit; cursor:pointer; border:1px solid var(--line); background:#fff; border-radius:8px; padding:8px 14px; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button:disabled { opacity:.5; }
  input, textarea { font:inherit; width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; }
  .doc { display:flex; justify-content:space-between; align-items:center; gap:6px; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .doc small { color:var(--muted); display:block; }
  .doc button { padding:4px 8px; font-size:12px; color:var(--danger); }
  #chat { display:flex; flex-direction:column; }
  #messages { flex:1; overflow-y:auto; }
  .msg { max-width:85%; margin:8px 0; padding:10px 14px; border-radius:14px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
  .user { margin-left:auto; background:var(--accent); color:#fff; }
  .bot { background:var(--bg); border:1px solid var(--line); }
  .src span { display:inline-block; background:var(--soft); color:var(--accent); border-radius:6px; padding:1px 6px; font-size:12px; margin:6px 4px 0 0; }
  details { margin-top:6px; font-size:12px; color:var(--muted); white-space:normal; }
  details li { margin:4px 0; }
  form.ask { display:flex; gap:8px; margin-top:8px; }
  .muted { color:var(--muted); font-size:13px; }
  @media (max-width:760px) { .wrap { grid-template-columns:1fr; height:auto; } #chat { height:70vh; } }
</style>
</head>
<body>
<header>📚 로컬 RAG 챗봇<span>Ollama + 하이브리드 검색(BM25 + 임베딩)</span></header>
<div class="wrap">
  <section class="panel">
    <h3>문서 등록</h3>
    <form id="up">
      <input id="title" placeholder="제목 (비우면 파일명)" style="margin-bottom:8px">
      <input id="file" type="file" accept=".pdf,.docx,.txt,.md,.csv" required style="margin-bottom:8px">
      <button class="primary" style="width:100%">업로드</button>
    </form>
    <h3 style="margin-top:18px">등록된 문서</h3>
    <div id="docs"></div>
  </section>
  <section class="panel" id="chat">
    <div id="messages"><div class="msg bot">문서를 등록하고 질문해 보세요. 답변 아래에서 검색된 근거를 확인할 수 있습니다.</div></div>
    <form class="ask" id="ask">
      <textarea id="q" rows="1" placeholder="질문 입력 (Enter 전송)"></textarea>
      <button class="primary" id="send">전송</button>
    </form>
  </section>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const history = [];

async function api(path, opts = {}) {
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || `오류 (${res.status})`);
  return data;
}

async function loadDocs() {
  const docs = await api("/api/documents");
  $("#docs").innerHTML = docs.length ? docs.map(d => `<div class="doc"><div>${esc(d.title)}<small>${d.chunks}개 조각 · ${esc(d.created_at)}</small></div>
    <button onclick="delDoc(${d.id})">삭제</button></div>`).join("") : '<p class="muted">등록된 문서가 없습니다.</p>';
}
async function delDoc(id) { if (confirm("삭제할까요?")) { await api(`/api/documents/${id}`, { method: "DELETE" }); loadDocs(); } }

$("#up").onsubmit = async e => {
  e.preventDefault(); const btn = e.target.querySelector("button"); btn.disabled = true; btn.textContent = "처리 중…";
  const fd = new FormData(); fd.append("file", $("#file").files[0]); fd.append("title", $("#title").value);
  try { await api("/api/documents", { method: "POST", body: fd }); e.target.reset(); loadDocs(); }
  catch (err) { alert(err.message); }
  finally { btn.disabled = false; btn.textContent = "업로드"; }
};

function add(cls, html) {
  const d = document.createElement("div"); d.className = `msg ${cls}`; d.innerHTML = html;
  $("#messages").appendChild(d); $("#messages").scrollTop = $("#messages").scrollHeight; return d;
}

async function ask() {
  const q = $("#q").value.trim(); if (!q) return;
  $("#q").value = ""; $("#send").disabled = true;
  add("user", esc(q)); const wait = add("bot", '<span class="muted">검색하고 답변을 만드는 중…</span>');
  try {
    const r = await api("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: q, history }) });
    history.push({ role: "user", content: q }, { role: "assistant", content: r.answer });
    wait.innerHTML = esc(r.answer)
      + (r.sources.length ? `<div class="src">${r.sources.map(s => `<span>${esc(s)}</span>`).join("")}</div>` : "")
      + `<details><summary>검색된 근거 ${r.retrieved.length}개</summary><ol>${r.retrieved.map(h =>
          `<li><b>${esc(h.title)}</b> (score ${h.score})<br>${esc(h.preview)}…</li>`).join("")}</ol></details>`;
  } catch (err) { wait.innerHTML = `<span style="color:var(--danger)">⚠️ ${esc(err.message)}</span>`; }
  finally { $("#send").disabled = false; $("#q").focus(); }
}
$("#ask").onsubmit = e => { e.preventDefault(); ask(); };
$("#q").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); ask(); } });
loadDocs();
</script>
</body>
</html>
