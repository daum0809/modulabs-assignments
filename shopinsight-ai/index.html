<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShopInsight AI</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="wrap">
<header><p class="eyebrow">AGENTIC COMMERCE ANALYTICS</p><h1>ShopInsight AI</h1><p>쇼핑몰 데이터를 넣으면 핵심 지표를 계산하고 문제 구간을 시각화합니다.</p></header>
<section class="actions">
<label class="upload">CSV 업로드<input id="file" type="file" accept=".csv"></label>
<button id="sample">샘플 데이터로 시작</button><span id="status">샘플 데이터를 불러와 시작하세요.</span>
</section>
<section id="app" hidden>
<div class="kpis">
<article><span>매출</span><strong id="revenue"></strong><small id="revenueChange"></small></article>
<article><span>광고비</span><strong id="spend"></strong><small id="spendChange"></small></article>
<article><span>ROAS</span><strong id="roas"></strong><small id="roasChange"></small></article>
<article><span>구매전환율</span><strong id="cvr"></strong><small id="cvrChange"></small></article>
</div>
<div class="grid">
<article class="panel"><h2>월별 성과</h2><div id="months"></div></article>
<article class="panel"><h2>구매 Funnel</h2><div id="funnel"></div></article>
</div>
<article class="panel"><h2>채널별 성과</h2><div id="channels"></div></article>
<article class="insight"><h2>데이터에서 확인된 변화</h2><p id="insight"></p><h3>자주 묻는 질문</h3><div class="faq" aria-label="자주 묻는 질문"><button type="button" class="faq-btn">매출이 왜 떨어졌어?</button><button type="button" class="faq-btn">광고비는 늘었는데 왜 매출이 안 늘었어?</button><button type="button" class="faq-btn">어떤 광고 채널의 성과가 가장 많이 변했어?</button><button type="button" class="faq-btn">어떤 상품을 먼저 확인해야 해?</button><button type="button" class="faq-btn">구매 전환율이 떨어진 이유를 분석해줘.</button><button type="button" class="faq-btn">지금 가장 먼저 확인해야 할 지표가 뭐야?</button></div><div class="question"><input id="question" value="광고비는 늘었는데 왜 매출이 떨어졌어?" aria-label="분석 질문"><button id="ask">분석하기</button></div><div id="answer" aria-live="polite"></div></article>
</section>
</main><script src="app.js?v=20260929-2"></script>
</body></html>
