<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gaussian Splat Viewer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1a2e; }
  canvas { display: block; }

  #panel {
    position: fixed;
    top: 12px;
    left: 12px;
    max-width: 340px;
    padding: 12px 14px;
    background: rgba(20, 20, 30, 0.75);
    color: #eee;
    font: 13px/1.5 system-ui, sans-serif;
    border-radius: 8px;
    pointer-events: none;
  }
  #panel h1 {
    margin: 0 0 8px;
    font-size: 13px;
    font-weight: 600;
    color: #9fd3ff;
  }
  #steps { list-style: none; margin: 0 0 10px; padding: 0; }
  #steps li { margin-bottom: 4px; }
  .mark { display: inline-block; width: 1.2em; }
  .mark.done { color: #6fdc7f; }
  .mark.fail { color: #ff6b6b; }
  .mark.pending { color: #888; }
  .hint { display: block; margin: 2px 0 6px 1.6em; color: #ffb3b3; font-size: 12px; }
  #stats { border-top: 1px solid rgba(255,255,255,0.2); padding-top: 8px; color: #bbb; }
  #stats div { margin-bottom: 2px; }

  #flipBtn {
    position: fixed;
    top: 12px;
    right: 12px;
    padding: 8px 12px;
    background: rgba(20, 20, 30, 0.75);
    color: #eee;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 6px;
    font: 13px system-ui, sans-serif;
    cursor: pointer;
  }
  #flipBtn:hover { background: rgba(40, 40, 60, 0.85); }
</style>
</head>
<body>

<div id="panel">
  <h1>진행 단계</h1>
  <ol id="steps"></ol>
  <div id="stats">
    <div id="statSize">파일 크기: -</div>
    <div id="statTime">받는 데 걸린 시간: -</div>
    <div id="statCount">알갱이 개수: -</div>
  </div>
</div>

<button id="flipBtn">위아래 뒤집기</button>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
    "@sparkjsdev/spark": "https://cdn.jsdelivr.net/npm/@sparkjsdev/spark/dist/spark.module.js"
  }
}
</script>

<script type="module">
// ── 여기 파일 이름만 바꾸면 다른 스플랫 파일을 띄울 수 있다 ──
const SPLAT_FILENAME = "scene.sog";

// 확장자를 Spark 내부 형식 이름으로 그대로 넘기면 안 되는 경우가 있어 대응표를 둔다.
// .sog 파일의 내부 형식 이름은 "pcsogszip" 이다.
const FORMAT_BY_EXTENSION = {
  sog: "pcsogszip",
};
function resolveFormat(filename) {
  const ext = filename.split(".").pop().toLowerCase();
  return FORMAT_BY_EXTENSION[ext] ?? ext;
}

// ── 진행 단계 표시 ──
const STEP_DEFS = [
  { id: "libs", label: "라이브러리 불러오기" },
  { id: "renderer", label: "렌더러 넣기" },
  { id: "fetch", label: "파일 받기" },
  { id: "parse", label: "알갱이로 풀기" },
  { id: "measure", label: "크기 재기" },
];
const stepStatus = {};
const stepsEl = document.getElementById("steps");

function renderSteps() {
  stepsEl.innerHTML = "";
  for (const { id, label } of STEP_DEFS) {
    const st = stepStatus[id] ?? { status: "pending" };
    const li = document.createElement("li");
    const mark = st.status === "done" ? "✓" : st.status === "fail" ? "✗" : "○";
    li.innerHTML = `<span class="mark ${st.status}">${mark}</span>${label}`;
    if (st.status === "fail" && st.hint) {
      const hint = document.createElement("span");
      hint.className = "hint";
      hint.textContent = st.hint;
      li.appendChild(hint);
    }
    stepsEl.appendChild(li);
  }
}
function setStep(id, status, hint) {
  stepStatus[id] = { status, hint };
  renderSteps();
}
renderSteps();

async function main() {
  let THREE, OrbitControls, SplatMesh, SparkRenderer;
  try {
    const [three, orbit, spark] = await Promise.all([
      import("three"),
      import("three/addons/controls/OrbitControls.js"),
      import("@sparkjsdev/spark"),
    ]);
    THREE = three;
    OrbitControls = orbit.OrbitControls;
    SplatMesh = spark.SplatMesh;
    SparkRenderer = spark.SparkRenderer;
    setStep("libs", "done");
  } catch (err) {
    console.error(err);
    setStep("libs", "fail", "브라우저 콘솔의 import 오류를 확인하고, 위쪽 importmap의 CDN 주소(특히 @sparkjsdev/spark 경로)를 점검하세요.");
    return;
  }

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x1a1a2e);
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 1000);
  camera.position.set(0, 0, 3);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  let sparkRenderer, splatMesh;
  try {
    // Spark 전용 렌더러를 장면에 넣어야 한다.
    // 이 한 줄이 없으면 알갱이를 다 읽고도 화면이 검은 채로 있고 오류도 나지 않는다.
    sparkRenderer = new SparkRenderer({ renderer });
    scene.add(sparkRenderer);
    setStep("renderer", "done");
  } catch (err) {
    console.error(err);
    setStep("renderer", "fail", "SparkRenderer 생성자 호출에서 콘솔 오류를 확인하세요.");
    return;
  }

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  let fileBytes;
  try {
    const t0 = performance.now();
    const res = await fetch(SPLAT_FILENAME);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const buf = await res.arrayBuffer();
    const seconds = (performance.now() - t0) / 1000;
    fileBytes = new Uint8Array(buf);

    document.getElementById("statSize").textContent =
      `파일 크기: ${(buf.byteLength / 1e6).toFixed(2)} MB`;
    document.getElementById("statTime").textContent =
      `받는 데 걸린 시간: ${seconds.toFixed(2)}초`;

    setStep("fetch", "done");
  } catch (err) {
    console.error(err);
    setStep("fetch", "fail", `"${SPLAT_FILENAME}" 파일이 이 페이지와 같은 폴더에 있는지, 그리고 이 페이지를 file://이 아니라 로컬 서버(예: python3 -m http.server)로 열었는지 확인하세요.`);
    return;
  }

  try {
    const fileType = resolveFormat(SPLAT_FILENAME);
    splatMesh = new SplatMesh({ fileBytes, fileType });
    await splatMesh.initialized;
    scene.add(splatMesh);

    const numSplats = splatMesh.numSplats ?? splatMesh.packedSplats?.numSplats;
    document.getElementById("statCount").textContent =
      `알갱이 개수: ${numSplats != null ? numSplats.toLocaleString() : "확인 안 됨"}`;

    setStep("parse", "done");
  } catch (err) {
    console.error(err);
    setStep("parse", "fail", `형식 이름("${resolveFormat(SPLAT_FILENAME)}")이 맞는지, 콘솔의 SplatMesh 생성 오류를 확인하세요.`);
    return;
  }

  // three.js의 Box3().setFromObject()는 splatMesh에 대해 빈 상자를 돌려주므로
  // Spark가 직접 재는 값을 써야 한다.
  try {
    const box =
      splatMesh.getBoundingBox?.() ??
      splatMesh.boundingBox ??
      splatMesh.packedSplats?.getBoundingBox?.() ??
      splatMesh.packedSplats?.boundingBox;

    if (!box || !box.min || !box.max) throw new Error("bounding box를 찾지 못했습니다.");

    const size = new THREE.Vector3();
    box.getSize(size);
    const center = new THREE.Vector3();
    box.getCenter(center);
    const radius = size.length() / 2;

    controls.target.copy(center);
    camera.position.copy(center).add(new THREE.Vector3(0, 0, Math.max(radius * 2.2, 0.1)));
    camera.near = Math.max(radius / 100, 0.001);
    camera.far = radius * 100 + 10;
    camera.updateProjectionMatrix();
    controls.update();

    setStep("measure", "done");
  } catch (err) {
    console.error(err);
    console.dir(splatMesh);
    setStep("measure", "fail", "splatMesh 객체를 콘솔에 찍어 두었습니다. bounds/boundingBox에 해당하는 속성·메서드 이름을 콘솔에서 찾아 이 부분 코드를 맞춰 고치세요. 카메라는 기본 거리에 놓아 두었습니다.");
  }

  document.getElementById("flipBtn").addEventListener("click", () => {
    if (!splatMesh) return;
    splatMesh.scale.y *= -1;
  });
}

main();
</script>
</body>
</html>
